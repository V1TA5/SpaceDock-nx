
# ==========================================
# SPACEDOCK - PYROSCOPE CONFIGURATION
# Grafana Pyroscope 2.2.0
# ==========================================

target: all

# ==========================================
# SERVER
# ==========================================

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 4040
  log_level: info

# ==========================================
# STORAGE
# ==========================================

storage:
  backend: filesystem

  filesystem:
    directory: /var/lib/pyroscope

# ==========================================
# INGESTER
# ==========================================

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory

      replication_factor: 1

# ==========================================
# USAGE REPORT
# ==========================================

analytics:
  reporting_enabled: false
