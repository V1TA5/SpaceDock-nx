
# ==========================================
# SPACEDOCK - TEMPO CONFIGURATION
# Grafana Tempo 3.1.1
# Monolithic deployment
# ==========================================

# ==========================================
# SERVER
# ==========================================

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

# ==========================================
# DISTRIBUTOR - OTLP RECEIVERS
# ==========================================

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

        http:
          endpoint: 0.0.0.0:4318

# ==========================================
# BACKEND WORKER
# COMPACTION AND RETENTION
# ==========================================

backend_worker:
  compaction:
    block_retention: 48h

# ==========================================
# METRICS GENERATOR
# ==========================================

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: spacedock

  storage:
    path: /var/tempo/generator/wal

    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true

  processor:
    service_graphs:
      dimensions:
        - service.namespace
        - deployment.environment

    span_metrics:
      dimensions:
        - service.namespace
        - deployment.environment
        - http.method
        - http.status_code

# ==========================================
# METRICS GENERATOR OVERRIDES
# ==========================================

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

# ==========================================
# TRACE STORAGE
# ==========================================

storage:
  trace:
    backend: local

    wal:
      path: /var/tempo/wal

    local:
      path: /var/tempo/blocks

# ==========================================
# USAGE REPORT
# ==========================================

usage_report:
  reporting_enabled: false
