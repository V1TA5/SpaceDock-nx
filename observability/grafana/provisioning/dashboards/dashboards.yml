
# ==========================================
# SPACEDOCK - GRAFANA DASHBOARD PROVIDERS
# Grafana 12.2.0
# ==========================================

apiVersion: 1

providers:
  - name: SpaceDock
    orgId: 1
    folder: SpaceDock
    type: file

    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true

    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
