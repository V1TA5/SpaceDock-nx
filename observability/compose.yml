
services:
  # ==========================================
  # GRAFANA
  # ==========================================

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-pyroscope-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - mimir
      - loki
      - tempo
      - pyroscope
    restart: unless-stopped
    networks:
      - spacedock-net

  # ==========================================
  # MIMIR
  # ==========================================

  mimir:
    image: grafana/mimir:2.16.0
    command:
      - -target=all
      - -config.file=/etc/mimir/mimir.yml
    volumes:
      - ./mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir-data:/data
    ports:
      - "9009:9009"
    restart: unless-stopped
    networks:
      - spacedock-net

  # ==========================================
  # LOKI
  # ==========================================

  loki:
    image: grafana/loki:3.5.0
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - spacedock-net

  # ==========================================
  # TEMPO
  # ==========================================

  tempo:
    image: grafana/tempo:2.8.0
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - spacedock-net

  # ==========================================
  # PYROSCOPE
  # ==========================================

  pyroscope:
    image: grafana/pyroscope:latest
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    ports:
      - "4040:4040"
    restart: unless-stopped
    networks:
      - spacedock-net

  # ==========================================
  # ALLOY
  # ==========================================

  alloy:
    image: grafana/alloy:v1.11.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
      - "4319:4317"
      - "4320:4318"
      - "12347:12347"
    depends_on:
      - mimir
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - spacedock-net


  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    pid: host
    restart: unless-stopped
    networks:
      - spacedock-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
    networks:
      - spacedock-net

  # ==========================================
  # POSTGRES EXPORTER
  # ==========================================

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_PASSWORD:-spacedock-dev-password}@db:5432/spacedock?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - spacedock-net

  # ==========================================
  # REDIS EXPORTER
  # ==========================================

  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - spacedock-net

  # ==========================================
  # BEYLA - LINUX EBPF
  # ==========================================

  beyla:
    image: grafana/beyla:latest
    profiles:
      - ebpf
    pid: "service:backend"
    environment:
      BEYLA_OPEN_PORT: "9998"
      BEYLA_SERVICE_NAME: spacedock-api
      BEYLA_PROMETHEUS_PORT: "8999"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    cap_add:
      - BPF
      - PERFMON
      - NET_ADMIN
      - SYS_RESOURCE
    security_opt:
      - apparmor:unconfined
    ports:
      - "8999:8999"
    depends_on:
      - backend
      - alloy
    restart: unless-stopped
    networks:
      - spacedock-net

  # ==========================================
  # K6 - LOAD TESTING
  # ==========================================

  k6:
    image: grafana/k6:latest
    profiles:
      - testing
    volumes:
      - ./k6:/scripts:ro
    command:
      - run
      - /scripts/smoke-test.js
    depends_on:
      - backend
    networks:
      - spacedock-net

volumes:
  grafana-data:
  mimir-data:
  loki-data:
  tempo-data:
  pyroscope-data:

networks:
  spacedock-net:
    driver: bridge
