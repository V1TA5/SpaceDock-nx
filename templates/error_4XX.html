<!DOCTYPE html>
<html>
<head><title>{{ error.code }} - Error</title></head>
<body>
{% if debug %}
<h1>{{ error.code }} - {{ error.name }}</h1>
<p>{{ error.description }}</p>
<div class="error-debug">
  <h3>Debug Info</h3>
  <pre>{{ error }}
Path: {{ request.path }}
Method: {{ request.method }}
User-Agent: {{ request.user_agent }}
Timestamp: {{ now() }}</pre>
</div>
{% else %}
<h1>{{ error.name }}</h1>
<p>{{ error.description }}</p>
<a href="/">Back to homepage</a>
{% endif %}
</body>
</html>
